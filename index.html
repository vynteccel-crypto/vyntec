<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VYNTEC – Assistência técnica e tecnologia em Sumaré/SP</title>
<meta name="description" content="Manutenção de celulares, computadores e videogames, serviços de TI e sistemas PDV em Sumaré/SP. Orçamento grátis pelo WhatsApp.">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&amp;family=Barlow:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
/* ===== Identidade VYNTEC ===== */
:root{--navy:#050d24;--navy2:#0a1a40;--blue:#1e6bff;--cyan:#19c8ff;--wa:#22c55e;--ink:#0b1630;--mute:#5b6784;--soft:#eef3fb;--line:#d9e2f2;
--head:'Rajdhani','Arial Narrow',sans-serif;--body:'Barlow','Segoe UI',Arial,sans-serif;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:76px}
body{margin:0;font-family:var(--body);font-size:17px;line-height:1.6;color:var(--ink);background:#fff}
a{color:inherit;text-decoration:none}
:focus-visible{outline:3px solid var(--cyan);outline-offset:3px}
.wrap{max-width:1080px;margin:0 auto;padding:0 22px}
h1,h2,h3{font-family:var(--head);line-height:1.08;margin:0}
.btn{display:inline-block;font-family:var(--head);font-weight:700;font-size:19px;padding:11px 24px;border-radius:8px;background:var(--wa);color:#04210f}
.btn.blue{background:linear-gradient(135deg,var(--blue),var(--cyan));color:#031024}
.btn.ghost{background:none;border:1.5px solid rgba(255,255,255,.5);color:#fff}
/* Cabeçalho fixo (fundo escuro; a logo tem fundo transparente) */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--navy);color:#fff;border-bottom:1px solid #16306b}
header.top .wrap{display:flex;align-items:center;justify-content:space-between;height:68px;gap:16px}
#logo-vyntec{height:40px!important;width:auto!important;display:block;background:transparent!important;filter:drop-shadow(0 0 10px rgba(30,107,255,.8))}
nav ul{display:flex;gap:26px;margin:0;padding:0;list-style:none;font-weight:600}
nav a:hover{color:var(--cyan)}
header.top .btn{padding:8px 18px;font-size:17px}
/* Hero */
.hero{background:radial-gradient(70% 80% at 80% 40%,#123a96 0%,var(--navy) 70%);color:#fff;padding:60px 0}
.hero .wrap{display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:center}
.hero h1{font-size:clamp(36px,5.6vw,60px);font-weight:700;margin-bottom:16px}
.hero h1 em{font-style:normal;color:var(--cyan)}
.hero p{color:#b9c6e4;max-width:50ch;margin:0 0 26px}
.btns{display:flex;gap:12px;flex-wrap:wrap}
#mascote-vyntec{width:100%;max-width:400px;margin:0 auto;display:block;border-radius:28px;box-shadow:0 0 70px rgba(25,200,255,.4)}
/* Seções */
section{padding:68px 0}
h2{font-size:clamp(30px,4.5vw,42px);color:var(--navy);margin-bottom:8px}
.sub{color:var(--mute);max-width:58ch;margin:0 0 34px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.card{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:14px;padding:26px 22px;background:#fff}
.card:hover{border-color:var(--blue);box-shadow:0 10px 30px rgba(30,107,255,.12)}
.card svg{width:46px;height:46px;stroke:var(--blue);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;margin-bottom:14px}
.card h3{font-size:26px;color:var(--navy);margin-bottom:8px}
.card p{margin:0 0 18px;color:var(--mute);flex:1}
.card a{font-weight:600;color:var(--blue)}
.card a:hover{text-decoration:underline}
/* Diferenciais */
.why{background:var(--navy);color:#fff}
.why h2{color:#fff}
.why .grid{gap:0}
.why .grid div{padding:6px 26px;border-left:3px solid var(--cyan)}
.why h3{font-size:24px;margin-bottom:6px}
.why p{margin:0;color:#b9c6e4}
/* Local + contato */
.loc{background:var(--soft)}
.loc .wrap{display:grid;grid-template-columns:1fr 1fr;gap:40px}
.info{display:grid;gap:16px;margin-bottom:26px}
.info div{border-left:3px solid var(--blue);padding-left:16px}
.info small{display:block;color:var(--mute);font-size:15px}
.info b{font-family:var(--head);font-size:23px;color:var(--navy)}
.cta-box{background:#fff;border:1px solid var(--line);border-radius:16px;padding:30px;align-self:start}
.cta-box h3{font-size:28px;color:var(--navy);margin-bottom:8px}
.cta-box p{color:var(--mute);margin:0 0 20px}
/* TV & Multimídia */
.tvm{background:var(--soft)}
.tvm h2.plans{margin-top:56px}
.tvm .grid.four{grid-template-columns:repeat(4,1fr)}
.price-card{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:14px;padding:26px 22px;background:#fff}
.price-card h3{font-size:24px;color:var(--navy)}
.price-card .price{font-family:var(--head);font-weight:700;font-size:38px;line-height:1.1;color:var(--blue);margin:8px 0}
.price-card p{margin:0 0 18px;color:var(--mute);flex:1}
.price-card .price{flex:none}
.tvm .note{margin:26px 0 0;color:var(--mute);font-size:15px}
@media (max-width:1000px){.tvm .grid.four{grid-template-columns:repeat(2,1fr)}}
@media (max-width:820px){.tvm .grid.four{grid-template-columns:1fr}}
footer{background:var(--navy);color:#b9c6e4;padding:36px 0 90px;font-size:15px}
footer b{font-family:var(--head);font-size:24px;color:#fff}
footer p{margin:6px 0 0;max-width:70ch}
/* Botão flutuante do WhatsApp */
.fab{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:20;width:58px;height:58px;border-radius:50%;background:var(--wa);display:grid;place-items:center;box-shadow:0 6px 20px rgba(0,0,0,.35)}
.fab svg{width:30px;height:30px;fill:#fff}
@media (max-width:820px){
nav{display:none}
.hero .wrap,.loc .wrap{grid-template-columns:1fr}
.grid{grid-template-columns:1fr}
.why .grid{gap:22px}
#mascote-vyntec{max-width:300px}
}

/* Planos: margens, centralização e cards adaptáveis */
.tvm h2.plans{max-width:760px;margin:48px auto 12px;text-align:center}
.tvm h2.plans + .sub{margin:0 auto 28px;text-align:center}
.tvm h2.plans ~ .grid.four{width:100%;max-width:1000px;margin:0 auto;grid-template-columns:repeat(4,minmax(0,1fr))}
.tvm .price-card{min-width:0;padding:24px 20px;overflow-wrap:break-word}
.tvm .price-card .btn{display:block;width:100%;padding:11px 14px;text-align:center;white-space:normal}
.tvm .note{max-width:760px;margin:26px auto 0;text-align:center;overflow-wrap:break-word;line-height:1.6}
@media(max-width:1000px){.tvm h2.plans ~ .grid.four{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:820px){
.tvm h2.plans{font-size:30px;line-height:1.15}
.tvm h2.plans ~ .grid.four{max-width:380px;grid-template-columns:minmax(0,1fr);gap:18px}
.tvm .price-card{padding:22px 20px}
.tvm .price-card h3{font-size:25px}
.tvm .price-card .price{font-size:34px}
.tvm .note{font-size:15px}
}

</style>
</head>
